location = /robots.txt {
    root /var/www/forge-site/current/forge;
    default_type text/plain;
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /forge {
    return 308 /forge/;
}

location ^~ /forge/downloads/ {
    root /var/www/forge-site/current;
    try_files $uri =404;
    autoindex off;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "public, max-age=86400";
}

location ^~ /forge/ {
    root /var/www/forge-site/current;
    index index.html;
    try_files $uri $uri/ =404;
    autoindex off;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "no-cache";
}
