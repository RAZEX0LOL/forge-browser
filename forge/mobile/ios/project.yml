name: ForgeMobile
options:
  bundleIdPrefix: org.forgebrowser
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
    GENERATE_INFOPLIST_FILE: YES
targets:
  ForgeMobile:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.forgebrowser.mobile.development
        INFOPLIST_KEY_CFBundleDisplayName: Forge Prototype
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  ForgeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ForgeMobile
schemes:
  ForgeMobile:
    build:
      targets:
        ForgeMobile: all
    test:
      targets: [ForgeMobileTests]
