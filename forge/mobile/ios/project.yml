name: ForgeMobile
options:
  bundleIdPrefix: org.forgebrowser
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
    GENERATE_INFOPLIST_FILE: YES
targets:
  ForgeMobile:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.forgebrowser.mobile.development
        INFOPLIST_KEY_CFBundleDisplayName: Forge Prototype
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: 'Forge uses the camera only after you allow access for a website.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Forge uses the microphone only after you allow access for a website.'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ForgeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ForgeMobile
  ForgeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.forgebrowser.mobile.keyboard-tests
        TEST_TARGET_NAME: ForgeMobile
    dependencies:
      - target: ForgeMobile
  ForgeMobileUploadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UploadUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.forgebrowser.mobile.upload-tests
        TEST_TARGET_NAME: ForgeMobile
    dependencies:
      - target: ForgeMobile
schemes:
  ForgeMobileUploadUI:
    build:
      targets:
        ForgeMobile: all
        ForgeMobileUploadUITests: [test]
    test:
      targets: [ForgeMobileUploadUITests]
      environmentVariables:
        FORGE_UPLOAD_FIXTURE_URL: $(FORGE_UPLOAD_FIXTURE_URL)
  ForgeMobile:
    build:
      targets:
        ForgeMobile: all
    test:
      targets: [ForgeMobileTests]
      environmentVariables:
        FORGE_TEST_HTTPS_PROXY_PORT: $(FORGE_TEST_HTTPS_PROXY_PORT)
  ForgeMobileKeyboardUI:
    build:
      targets:
        ForgeMobile: all
        ForgeMobileUITests: [test]
    test:
      targets: [ForgeMobileUITests]
      environmentVariables:
        FORGE_UI_TEST_LANGUAGE: $(FORGE_UI_TEST_LANGUAGE)
