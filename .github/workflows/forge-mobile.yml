name: Forge mobile prototypes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: forge/mobile/android
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: forge/mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Allow this hosted runner to use KVM
        run: |
          sudo apt-get install -y acl
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Android native UI and Gecko runtime checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          working-directory: forge/mobile/android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-android-prototype-debug
          path: forge/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forge/mobile/ios
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: forge/mobile
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project ForgeMobile.xcodeproj -scheme ForgeMobile -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Run native iOS tests on an available hosted simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone") and x.get("isAvailable")))')
          xcodebuild -quiet -project ForgeMobile.xcodeproj -scheme ForgeMobile -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build CODE_SIGN_IDENTITY=- test
      - run: ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/ForgeMobile.app Forge-ios-simulator-prototype.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-ios-simulator-prototype
          path: forge/mobile/ios/Forge-ios-simulator-prototype.zip
          if-no-files-found: error
          retention-days: 7
