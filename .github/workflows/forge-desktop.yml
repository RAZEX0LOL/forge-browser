name: Forge native desktop builds
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native platform to build
        type: choice
        default: all
        options: [all, linux-x64, windows-x64, macos-intel]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = [
            {'runner': 'ubuntu-24.04', 'target': 'linux-x64'},
            {'runner': 'windows-2022', 'target': 'windows-x64'},
            {'runner': 'macos-15-intel', 'target': 'macos-intel'},
          ]
          selected = [t for t in targets if os.environ['TARGET'] in ('all', t['target'])]
          if not selected:
              raise SystemExit('Unknown platform')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': selected}) + '\n')
          PY
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libdbus-glib-1-dev libasound2-dev libx11-xcb-dev libxt-dev xvfb
      - name: MozillaBuild on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\MozillaBuildSetup-4.2.1.exe"
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.2.1.exe -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          # Corroborated against the Chocolatey MozillaBuild 4.2.1 verification record.
          if ($hash -ne '8ef5b3d2087e4867dc75bf19f5e62f12e917f518239415723cc70896b6f1e3d8') { throw 'MozillaBuild checksum mismatch' }
          $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'MozillaBuild installation failed' }
          'C:\mozilla-build\bin' >> $env:GITHUB_PATH
          'MOZILLABUILD=C:\mozilla-build\' >> $env:GITHUB_ENV
      - name: Python dependencies
        run: python -m pip install -r forge/requirements-test.txt -r forge/requirements-package.txt
      - name: Build and package
        id: package
        run: python forge/scripts/ci_desktop.py --output "${{ runner.temp }}/forge-packages"
      - name: Browser integration checks
        run: python forge/scripts/smoke.py --binary "${{ steps.package.outputs.binary }}"
      - name: Upload only after runtime checks pass
        uses: actions/upload-artifact@v4
        with:
          name: Forge-development-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/forge-packages/*.zip
            ${{ runner.temp }}/forge-packages/*.tar.xz
            ${{ runner.temp }}/forge-packages/SOURCE.json
            ${{ runner.temp }}/forge-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Upload smoke result (no profiles)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-smoke-${{ matrix.target }}
          path: forge/test-results/smoke.json
          if-no-files-found: ignore
          retention-days: 7
